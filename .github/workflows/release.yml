name: Release
on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true
      GH_PAT:
        required: false
      RELEASE_GITHUB_TOKEN:
        required: false
  push:
    paths:
      - 'cli/**'
      - 'runtime/**'
      - '.changeset/**'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/release/**'
      - '.github/workflows/release.yml'
    branches:
      - 'master'
      - 'develop'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  CI: true

jobs:
  Release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      # Required for npm provenance: lets `npm publish --provenance` mint
      # an OIDC token that npm verifies against the GitHub Actions workflow.
      id-token: write

    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.RELEASE_GITHUB_TOKEN || github.token }}

      - name: Detect release changesets
        id: release_changesets
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          elif [ -f .changeset/pre.json ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
            echo "Found Changesets prerelease state; continuing release."
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "No release changesets or prerelease state found; skipping version and publish."
          fi

      - name: Setup Bun
        if: steps.release_changesets.outputs.has_changesets == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Bun
        if: steps.release_changesets.outputs.has_changesets == 'true'
        run: |
          bun ci

      - name: Configure npm authentication
        if: steps.release_changesets.outputs.has_changesets == 'true'
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"

      - name: Verify npm authentication
        if: steps.release_changesets.outputs.has_changesets == 'true'
        run: npm whoami --registry https://registry.npmjs.org

      - name: Disable AppArmor
        if: steps.release_changesets.outputs.has_changesets == 'true'
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Verify release inputs
        if: steps.release_changesets.outputs.has_changesets == 'true'
        run: bun run release:verify

      - name: Ensure verification did not modify tracked files
        if: steps.release_changesets.outputs.has_changesets == 'true'
        run: git diff --exit-code

      - name: Configure git author
        if: steps.release_changesets.outputs.has_changesets == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Version packages
        if: steps.release_changesets.outputs.has_changesets == 'true'
        run: ${{ github.ref_name == 'develop' && 'bun run release:version:beta' || 'bun run release:version:stable' }}

      - name: Commit version updates
        id: version_commit
        if: steps.release_changesets.outputs.has_changesets == 'true'
        run: |
          if git diff --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No version changes generated; skipping publish."
            exit 0
          fi

          git add .
          git commit -m "chore(release): version packages (${{ github.ref_name }}) [skip ci]"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push version commit
        if: steps.version_commit.outputs.committed == 'true'
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Publish packages
        if: steps.version_commit.outputs.committed == 'true'
        env:
          RELEASE_CHANNEL: ${{ github.ref_name == 'develop' && 'beta' || 'latest' }}
          # npm provenance is supported only from GitHub Actions with id-token: write.
          # Local releases (scripts/release/release-local.mjs) leave this unset.
          RELEASE_PROVENANCE: 'true'
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run release:publish
