name: Release Recovery

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish from
        required: true
        default: master
        type: string
      channel:
        description: npm dist-tag to publish to
        required: true
        default: latest
        type: choice
        options:
          - latest
          - beta
      run_checks:
        description: Run the full release verification suite before recovery publish
        required: true
        default: false
        type: boolean
      dry_run:
        description: Print the recovery publish actions without publishing
        required: true
        default: false
        type: boolean

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  CI: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Verify npm authentication
        if: ${{ !inputs.dry_run }}
        run: npm whoami --registry https://registry.npmjs.org

      - name: Disable AppArmor
        if: inputs.run_checks
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Verify release inputs
        if: inputs.run_checks
        run: yarn release:verify

      - name: Ensure verification did not modify tracked files
        if: inputs.run_checks
        run: git diff --exit-code

      - name: Recover publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: yarn release:publish
